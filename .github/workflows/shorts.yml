name: shorts
on:
  workflow_dispatch:
    inputs:
      bgrun: {description: run id of bg workflow, default: '46010523648'}
      bg_meadow: {description: meadow bg file, default: meadow_xl1}
      bg_candy: {description: candy bg file, default: candy_xl1}
      bg_night: {description: night bg file, default: night_xl1}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        short: [ant, candy, sleep]
        lang: [ar, en]
        a: [0, 120, 240, 360]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bgs-*
          merge-multiple: true
          path: shorts/bgs
          run-id: ${{ inputs.bgrun }}
          github-token: ${{ github.token }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core libraqm0 fonts-dejavu-core ffmpeg && pip install -q pillow numpy
      - env:
          BG_meadow: ${{ inputs.bg_meadow }}
          BG_candy: ${{ inputs.bg_candy }}
          BG_night: ${{ inputs.bg_night }}
        run: |
          cd shorts
          b=$(( ${{ matrix.a }} + 120 ))
          if [ "${{ matrix.lang }}" = en ]; then export NOAR=1 SUF=_en; fi
          if [ "${{ matrix.short }}" = ant ]; then python3 whatif_ant.py ${{ matrix.a }} $b; D=ant$SUF; else python3 whatif_pack.py ${{ matrix.short }} ${{ matrix.a }} $b; D=${{ matrix.short }}$SUF; fi
          ffmpeg -v error -y -framerate 24 -start_number ${{ matrix.a }} -i $D/%04d.png -frames:v 120 -c:v libx264 -crf 14 -preset medium -pix_fmt yuv420p -g 24 chunk_${{ matrix.short }}_${{ matrix.lang }}_$(printf %03d ${{ matrix.a }}).mp4
          ls -la chunk_*
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.short }}-${{ matrix.lang }}-${{ matrix.a }}
          path: shorts/chunk_*.mp4
          retention-days: 2
  join:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: chunk-*, merge-multiple: true, path: c}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - run: |
          cd c
          for s in ant candy sleep; do for l in ar en; do
            ls chunk_${s}_${l}_*.mp4 | sort | sed "s/^/file /" > l.txt
            ffmpeg -v error -y -f concat -i l.txt -c copy ../silent_${s}_${l}.mp4
          done; done
          cd ..; ls -la silent_*; for f in silent_*; do ffprobe -v error -show_entries format=duration -of csv=p=0 $f; done
      - uses: actions/upload-artifact@v4
        with: {name: silent, path: "silent_*.mp4", retention-days: 3}
